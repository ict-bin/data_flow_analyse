name: build-secflow-app-dataflow-analyse-image

env:
  IMAGE_OWNER: runshine
  IMAGE_NAME: secflow-app-dataflow-analyse

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted unit tests
        run: |
          python -m unittest \
            test_runner.py \
            test_review_policy.py \
            test_upstream_entry_hints.py

  build-amd64:
    needs: [prepare, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || env.IMAGE_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build amd64 image
        run: |
          docker build \
            --file Dockerfile \
            --tag ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-latest \
            --tag ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-${{ needs.prepare.outputs.date_tag }} \
            .

      - name: Push amd64 image
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: [prepare, unit-tests]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || env.IMAGE_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build arm64 image
        run: |
          docker build \
            --file Dockerfile \
            --tag ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-latest \
            --tag ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-${{ needs.prepare.outputs.date_tag }} \
            .

      - name: Push arm64 image
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || env.IMAGE_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest \
            --amend ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-latest \
            --amend ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-latest
          docker manifest push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          docker manifest create ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.date_tag }}
